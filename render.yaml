# Render Blueprint — one free web service that serves both the API and the built React app.
services:
  - type: web
    name: rnd-evaluator
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false          # you paste the key in the Render dashboard; never in the code
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.6-flash,gemini-3.8-flash
